apiVersion: v1
kind: Secret
metadata:
  name: authz-policy
  labels:
    {{- include "authz.labels" . | nindent 4 }}
type: Opaque
stringData:
  policy.json: |
    {"methods":{{ .Values.policy.methods | toJson }},
     "identities":[
      {"subject":"demo-admin","token":{{ required "Set credentials.adminToken" .Values.credentials.adminToken | toJson }},"paths":{{ .Values.policy.adminPaths | toJson }}},
      {"subject":"demo-reader","token":{{ required "Set credentials.readerToken" .Values.credentials.readerToken | toJson }},"paths":{{ .Values.policy.readerPaths | toJson }}}
    ]}

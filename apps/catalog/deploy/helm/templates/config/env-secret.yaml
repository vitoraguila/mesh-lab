{{- if and .Values.existingEnvSecret .Values.secrets }}
{{- fail "Use either existingEnvSecret or secrets, not both" }}
{{- end }}
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: catalog-env
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if or (has $key (list "APP_ENV" "HTTP_PORT" "INTERNAL_API_URL")) (hasKey $.Values.config $key) }}
  {{- fail (printf "Secret key %s conflicts with chart-managed or non-secret config" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.existingEnvSecret .Values.secrets }}
{{- fail "Use either existingEnvSecret or secrets, not both" }}
{{- end }}
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-env
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

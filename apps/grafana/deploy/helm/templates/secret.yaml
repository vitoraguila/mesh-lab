# Viewer login. Generated per environment into ignored .local files, never Git.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: {{ required "Set credentials.username" .Values.credentials.username | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ required "Set credentials.password" .Values.credentials.password | quote }}

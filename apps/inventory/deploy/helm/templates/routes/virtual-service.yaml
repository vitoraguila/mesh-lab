# Delegated by deploy/helm/platform/templates/routes.yaml. Delegates omit hosts/gateways.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: inventory-routes
spec:
  exportTo: ["."]
  http:
    - name: inventory
      match:
        - uri:
            exact: {{ .Values.route.path | quote }}
      timeout: {{ .Values.route.timeout }}
      route:
        - destination:
            host: inventory.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}

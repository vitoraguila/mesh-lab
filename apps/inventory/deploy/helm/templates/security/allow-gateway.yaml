apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: inventory-from-gateway
spec:
  selector:
    matchLabels:
      app: inventory
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.global.gateway.serviceAccount }}"
      to:
        - operation:
            methods: [GET]
            ports: ["8080"]

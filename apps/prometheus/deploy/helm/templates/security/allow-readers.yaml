# Query access by workload identity. There is no gateway route to Prometheus,
# so no browser can reach it directly and no user token is involved.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: prometheus-from-workloads
spec:
  selector:
    matchLabels:
      app: prometheus
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range .Values.readers }}
              - "cluster.local/ns/{{ $.Release.Namespace }}/sa/{{ . }}"
              {{- end }}
      to:
        - operation:
            methods: [GET, POST]
            ports: ["9090"]

# Documentation only: Make never automatically loads this file.
# `make secrets ENV=stg` writes real values to .local/stg/rabbitmq-secrets.json.
# Only define secrets that the broker actually consumes.
rabbitmq:
  credentials:
    username: "replace-locally"
    password: "replace-locally"
  secrets: {}
  # Alternatively set existingEnvSecret: rabbitmq-external-env

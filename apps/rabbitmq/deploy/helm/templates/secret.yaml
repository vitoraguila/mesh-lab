# Broker login. Generated per environment into ignored .local files, never Git.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ required "Set credentials.username" .Values.credentials.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ required "Set credentials.password" .Values.credentials.password | quote }}

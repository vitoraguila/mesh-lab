apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    # The tcp- prefix selects plain TCP in Istio; the sidecars still apply mTLS.
    - name: tcp-amqp
      port: {{ .Values.service.port }}
      targetPort: amqp
      appProtocol: tcp

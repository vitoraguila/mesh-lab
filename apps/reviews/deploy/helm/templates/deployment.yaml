apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews
  labels:
    {{- include "reviews.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      labels:
        app: reviews
        version: v1
        role: business-api
        {{- include "reviews.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config/config-map.yaml") . | sha256sum }}
        checksum/env-secret: {{ include (print $.Template.BasePath "/config/env-secret.yaml") . | sha256sum }}
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
        {{- if .Values.metrics.enabled }}
        # The sidecar scrapes this locally and merges it into its own :15020 output.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: reviews
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: reviews
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: reviews-config
            {{- if .Values.broker.enabled }}
            # Event transport topology and login, owned by the rabbitmq chart.
            - configMapRef:
                name: {{ .Values.broker.connectionName }}
            - secretRef:
                name: {{ printf "%s-credentials" .Values.broker.connectionName }}
            {{- end }}
            {{- if .Values.existingEnvSecret }}
            - secretRef:
                name: {{ .Values.existingEnvSecret }}
            {{- else if .Values.secrets }}
            - secretRef:
                name: reviews-env
            {{- end }}
